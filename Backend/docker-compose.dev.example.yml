version: '3.8'
name: gym-store
services:
  postgres:
    image: postgres:16-alpine
    container_name: gymstore-postgres
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      PRODUCT_DB_PASSWORD: "${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in Backend/.env}"
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in Backend/.env}"
      ORDER_DB_PASSWORD: "${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in Backend/.env}"
      PAYMENT_DB_PASSWORD: "${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in Backend/.env}"
      WORKFLOW_DB_PASSWORD: "${WORKFLOW_DB_PASSWORD:?Set WORKFLOW_DB_PASSWORD in Backend/.env}"
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in Backend/.env}"
      NOTIFICATION_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in Backend/.env}"
      REPORT_DB_PASSWORD: "${REPORT_DB_PASSWORD:?Set REPORT_DB_PASSWORD in Backend/.env}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-migrations/postgres-setup.sql.example:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gymstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymstore-redis
    ports:
      - "6379:6379"
    networks:
      - gymstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  kafka:
    image: apache/kafka:3.7.0
    container_name: gymstore-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - gymstore-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: gymstore-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: "${KEYCLOAK_DB_USERNAME:-keycloak_user}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in Backend/.env}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in Backend/.env}"
      KC_HTTP_PORT: 8080
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gymstore-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gymstore-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - gymstore-network

  
  # MICROSERVICES - DEV MODE WITH HOT RELOAD

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: api-gateway
    container_name: gymstore-api-gateway-dev
    ports:
      - "8080:8080"
      - "5000:5005"  # Debug port
    volumes:
      - ./api-gateway/src:/app/api-gateway/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${KEYCLOAK_DB_USERNAME:-keycloak_user}"
      DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in Backend/.env}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in Backend/.env}"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - gymstore-network

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: product-service
    container_name: gymstore-product-service-dev
    ports:
      - "8081:8080"
      - "5001:5005"
    volumes:
      - ./product-service/src:/app/product-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${PRODUCT_DB_USERNAME:-product_user}"
      DB_PASSWORD: "${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in Backend/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gymstore-network

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: inventory-service
    container_name: gymstore-inventory-service-dev
    ports:
      - "8082:8080"
      - "5002:5005"
    volumes:
      - ./inventory-service/src:/app/inventory-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${INVENTORY_DB_USERNAME:-inventory_user}"
      DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD in Backend/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gymstore-network

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: cart-service
    container_name: gymstore-cart-service-dev
    ports:
      - "8083:8080"
      - "5003:5005"
    volumes:
      - ./cart-service/src:/app/cart-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - gymstore-network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: order-service
    container_name: gymstore-order-service-dev
    ports:
      - "8084:8080"
      - "5004:5005"
    volumes:
      - ./order-service/src:/app/order-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${ORDER_DB_USERNAME:-order_user}"
      DB_PASSWORD: "${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in Backend/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gymstore-network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: payment-service
    container_name: gymstore-payment-service-dev
    ports:
      - "8085:8080"
      - "5005:5005"
    volumes:
      - ./payment-service/src:/app/payment-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${PAYMENT_DB_USERNAME:-payment_user}"
      DB_PASSWORD: "${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in Backend/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gymstore-network

  workflow-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: workflow-service
    container_name: gymstore-workflow-service-dev
    ports:
      - "8086:8080"
      - "5006:5005"
    volumes:
      - ./workflow-service/src:/app/workflow-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${WORKFLOW_DB_USERNAME:-workflow_user}"
      DB_PASSWORD: "${WORKFLOW_DB_PASSWORD:?Set WORKFLOW_DB_PASSWORD in Backend/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - gymstore-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: notification-service
    container_name: gymstore-notification-service-dev
    ports:
      - "8087:8080"
      - "5007:5005"
    volumes:
      - ./notification-service/src:/app/notification-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${NOTIFICATION_DB_USERNAME:-notification_user}"
      DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in Backend/.env}"
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - gymstore-network

  report-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        SERVICE_NAME: report-service
    container_name: gymstore-report-service-dev
    ports:
      - "8088:8080"
      - "5008:5005"
    volumes:
      - ./report-service/src:/app/report-service/src
      - ./gymstore-common:/app/gymstore-common
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: "${REPORT_DB_USERNAME:-report_user}"
      DB_PASSWORD: "${REPORT_DB_PASSWORD:?Set REPORT_DB_PASSWORD in Backend/.env}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gymstore-network

networks:
  gymstore-network:
    driver: bridge

volumes:
  postgres_data:
  maven_cache:

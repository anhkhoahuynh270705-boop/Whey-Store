# Cart Service - Docker Configuration (Redis-based, no PostgreSQL)
spring:
  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:19092

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/gymstore/protocol/openid-connect/certs

server:
  port: 8083

# Internal service URLs in Docker network
product-service:
  url: http://product-service:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gymstore: DEBUG

# Product Service - Docker Configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/product_db}
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:change-me}"

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:19092

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/gymstore/protocol/openid-connect/certs

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gymstore: DEBUG

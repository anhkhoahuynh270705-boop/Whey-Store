# Workflow Service - Docker Configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/workflow_db}
    username: postgres
    password: ${DB_PASSWORD:Khoa123}

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:19092

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/gymstore/protocol/openid-connect/certs

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

server:
  port: 8086

# Internal service URLs in Docker network
order-service:
  url: http://order-service:8084
inventory-service:
  url: http://inventory-service:8082
payment-service:
  url: http://payment-service:8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gymstore: DEBUG

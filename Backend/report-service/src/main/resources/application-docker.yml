# Report Service - Docker Configuration
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/report_db}
    username: postgres
    password: ${DB_PASSWORD:Khoa123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/gymstore/protocol/openid-connect/certs
server:
  port: 8088
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  security:
    enabled: false
logging:
  level:
    com.gymstore: DEBUG

<div class="admin-shell" [class.sidebar-collapsed]="!sidebarOpen()">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon"><i class="fas fa-bolt"></i></span>
      <span class="logo-text">ADMIN</span>
    </div>

    <nav class="sidebar-nav">
      @for (item of nav; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        >
          <i [class]="item.icon + ' nav-icon'"></i>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <span class="user-avatar">{{
          (auth.fullName ?? auth.username ?? 'A')[0].toUpperCase()
        }}</span>
        <div class="user-meta">
          <span class="user-name">{{ auth.fullName ?? auth.username }}</span>
          <span class="user-role">Administrator</span>
        </div>
      </div>
      <button class="btn-logout" (click)="auth.logout()" title="Đăng xuất">
        <i class="fas fa-power-off"></i>
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="topbar">
      <button class="toggle-btn" (click)="sidebarOpen.set(!sidebarOpen())" title="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-title">
        <span>GymStore</span>
        <span class="topbar-sep">/</span>
        <span class="topbar-sub">Quản trị hệ thống</span>
      </div>
      <div class="topbar-actions">
        <a
          href="http://localhost:4200"
          target="_blank"
          class="topbar-link"
          title="Xem trang khách hàng"
        >
          <i class="fas fa-store"></i> Storefront
        </a>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
  <app-toast />
</div>

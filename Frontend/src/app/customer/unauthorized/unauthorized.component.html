<div class="unauthorized-page container">

      <i class="fas fa-shield-halved"></i>
    </div>

    <p>Bạn không có quyền xem trang này. Vui lòng đăng nhập với tài khoản có quyền hạn phù hợp.</p>
    <div class="actions">
      <button class="btn" (click)="goHome()">
        <i class="fas fa-home"></i> Về trang chủ

      </button>
    </div>
  </div>
</div>
